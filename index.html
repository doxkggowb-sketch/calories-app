/**
 * window.storage polyfill
 * ------------------------------------------------------------------
 * The app below was originally built against `window.storage`, an
 * Anthropic-provided key/value API available inside Claude.ai artifacts
 * (real localStorage is blocked there). Opened as a plain HTML file in a
 * normal browser, real localStorage works fine, so this re-implements the
 * same get/set/delete/list methods on top of it. Nothing in the app code
 * below needed to change.
 */
(function () {
  var PREFIX = "calories-app:";
  function realKey(key) { return PREFIX + key; }
  window.storage = {
    get: function (key) {
      return new Promise(function (resolve, reject) {
        var raw = window.localStorage.getItem(realKey(key));
        if (raw === null) { reject(new Error("No value for key: " + key)); return; }
        resolve({ key: key, value: raw, shared: false });
      });
    },
    set: function (key, value) {
      return new Promise(function (resolve) {
        window.localStorage.setItem(realKey(key), value);
        resolve({ key: key, value: value, shared: false });
      });
    },
    delete: function (key) {
      return new Promise(function (resolve) {
        var existed = window.localStorage.getItem(realKey(key)) !== null;
        window.localStorage.removeItem(realKey(key));
        resolve({ key: key, deleted: existed, shared: false });
      });
    },
    list: function (prefix) {
      return new Promise(function (resolve) {
        var keys = [];
        for (var i = 0; i < window.localStorage.length; i++) {
          var k = window.localStorage.key(i);
          if (k && k.indexOf(PREFIX) === 0) {
            var shortKey = k.slice(PREFIX.length);
            if (!prefix || shortKey.indexOf(prefix) === 0) keys.push(shortKey);
          }
        }
        resolve({ keys: keys, prefix: prefix, shared: false });
      });
    }
  };
})();
</script>

const SCAN_MAX_EDGE = 1024; // longest side after client-side resize
const SCAN_JPEG_QUALITY = 0.7;
/** Validates + resizes/compresses an image file in the browser (canvas-based),
 *  returning a base64 payload small enough to send cheaply, plus a preview URL. */
function compressImageFile(file) {
    return new Promise((resolve, reject) => {
        if (!file.type || !file.type.startsWith("image/")) {
            reject(new Error("unsupported_image"));
            return;
        }
        if (file.size > MAX_SCAN_IMAGE_BYTES) {
            reject(new Error("image_too_large"));
            return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("unsupported_image"));
        reader.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error("unsupported_image"));
            img.onload = () => {
                let { width, height } = img;
                if (width > SCAN_MAX_EDGE || height > SCAN_MAX_EDGE) {
                    if (width > height) {
                        height = Math.round(height * (SCAN_MAX_EDGE / width));
                        width = SCAN_MAX_EDGE;
                    }
                    else {
                        width = Math.round(width * (SCAN_MAX_EDGE / height));
                        height = SCAN_MAX_EDGE;
                    }
                }
                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);
                const dataUrl = canvas.toDataURL("image/jpeg", SCAN_JPEG_QUALITY);
                const base64 = dataUrl.split(",")[1] || "";
                resolve({ base64, mimeType: "image/jpeg", previewUrl: dataUrl });
            };
            img.src = reader.result;
        };
        reader.readAsDataURL(file);
    });
}

/* ==============================================================================
   FOOD DATA SERVICE LAYER
   The UI never touches FOOD_DB directly — everything goes through FoodService.
   Supabase's `foods` table is now the primary source (fetched once on app
   load, public read, no auth required); FOOD_DB stays as the bundled
   fallback/cache used until that fetch succeeds or if it ever fails, so the
   app is never left without a food catalog.
   ============================================================================== */
function normalizeSearchText(s) {
    return (s || "").toString().toLowerCase().trim();
}
function mapFoodRow(row) {
    return {
        id: row.id,
        name: row.name,
        nameEn: row.name_en,
        nameFr: row.name_fr,
        nameAr: row.name_ar,
        category: row.category,
        subcategory: row.subcategory,
        emoji: row.emoji,
        caloriesPer100g: row.calories_per_100g,
        proteinPer100g: row.protein_per_100g,
        carbsPer100g: row.carbs_per_100g,
        fatPer100g: row.fat_per_100g,
        fiberPer100g: row.fiber_per_100g,
        servings: row.servings || [],
        defaultServing: row.default_serving,
        defaultServingSize: row.default_serving_grams,
        searchableKeywords: row.searchable_keywords || [],
        note: row.note,
    };
}
let CATALOG = FOOD_DB;
const FoodService = {
    setCatalog(rows) {
        if (Array.isArray(rows) && rows.length > 0)
            CATALOG = rows;
    },
    getAll() {
        return CATALOG;
    },
    getById(id) {
        return CATALOG.find((f) => f.id === id) || null;
    },
    getByCategory(category) {
        return CATALOG.filter((f) => f.category === category);
    },
    getBySubcategory(category, subcategory) {
        return CATALOG.filter((f) => f.category === category && f.subcategory === subcategory);
    },
    search(query) {
        const q = normalizeSearchText(query);
        if (!q)
            return CATALOG;
        return CATALOG.filter((f) => {
            const haystack = [
                f.name, f.nameEn, f.nameFr, f.nameAr, f.category, f.subcategory,
                ...(f.searchableKeywords || []),
            ].map(normalizeSearchText);
            return haystack.some((h) => h.includes(q));
        });
    },
    getByIds(ids) {
        return ids.map((id) => this.getById(id)).filter(Boolean);
    },
};
/* --------------------------------- HELPERS --------------------------------- */
const round = (n) => Math.round(n);
const round1 = (n) => Math.round(n * 10) / 10;
const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
const uid = () => Math.random().toString(36).slice(2, 10);
const todayKey = () => new Date().toISOString().slice(0, 10);
/* Explicit DD/MM/YYYY formatter — never relies on ambiguous locale string concatenation */
function formatDMY(dateStr) {
    const [y, m, d] = dateStr.split("-");
    return `${d}/${m}/${y}`;
}
function formatShort(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
const ACTIVITY_MULTIPLIERS = {
    Sedentary: 1.2,
    "Lightly active": 1.375,
    "Moderately active": 1.55,
    "Very active": 1.725,
    "Extra active": 1.9,
};
function computeNutrition(food, grams) {
    const g = Math.max(0, grams) / 100;
    return {
        cal: round(food.caloriesPer100g * g),
        protein: round1(food.proteinPer100g * g),
        carbs: round1(food.carbsPer100g * g),
        fat: round1(food.fatPer100g * g),
        fiber: round1((food.fiberPer100g || 0) * g),
    };
}
/* Mifflin-St Jeor BMR -> TDEE -> goal-adjusted estimated daily target */
function calculateCalorieTarget(profile) {
    const age = clamp(Number(profile.age) || 30, 10, 100);
    const height = clamp(Number(profile.height) || 170, 100, 230);
